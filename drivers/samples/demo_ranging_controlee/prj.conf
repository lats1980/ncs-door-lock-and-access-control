# demo_ranging_controlee (Controlee / Responder): SR150 ranging demo on the NXP middleware port.

# Basic system
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_MPU_STACK_GUARD=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_INFO_COLOR_GREEN=y

# NXP SR150 UWB middleware (drivers/uwb/nxp)
CONFIG_UWB_NXP=y
CONFIG_UWB_NXP_LOG_LEVEL=3
CONFIG_UWB_NXP_PLATFORM_LOG_LEVEL=3
