# AT transport: BLE peripheral (NUS server) on AT Module, for Matter + Aliro AT Host.
# Pairs with AT Host as NUS central (same as bt_nus / central_uart).
CONFIG_ALIRO_AT_TRANSPORT_SERIAL=n
CONFIG_ALIRO_AT_TRANSPORT_BLE=y

CONFIG_DOOR_LOCK_NUS_SERVICE=y
# Exclude Lock NUS commands from the default NUS command pool, since the module doesn't need them and it saves RAM.
CONFIG_DOOR_LOCK_NUS_SERVICE_MAX_COMMANDS=1
# Increase max command length to allow for longer AT commands (e.g. with more parameters) - adjust as needed.
CONFIG_DOOR_LOCK_NUS_SERVICE_MAX_COMMAND_LEN=200
# Don't need authentication or passkey entry for the module role in this demo, so disable to save code/RAM.
CONFIG_BT_NUS_AUTHEN=n
CONFIG_BT_APP_PASSKEY=n
CONFIG_DOOR_LOCK_BLE_MANAGER=y
CONFIG_DOOR_LOCK_BLE_MANAGER_AUTH=n
CONFIG_DOOR_LOCK_BLE_MANAGER_AUTH_APP_PASSKEY_SUPPORT=n
# AT Host NUS client uses bonding (bt_foreach_bond); must match for pairing with Matter AT Host.
CONFIG_BT_BONDABLE=y

CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_DEVICE_APPEARANCE=883
