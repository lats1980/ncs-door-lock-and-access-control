CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_SHELL_LOG_BACKEND=n

# increase RTT buffer size to avoid losing log messages
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# No LED on custom board
# Disable LED indicator for lock simulation
CONFIG_DOOR_LOCK_ALIRO_LOCK_SIM_INDICATOR=n

CONFIG_DOOR_LOCK_EXTERNAL_NVS=n
CONFIG_DOOR_LOCK_INTERNAL_ZMS=y

# NXP PN5190 NFC reader
# Disable PM runtime for PN5190
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_NFC_DRIVER_STM=n
CONFIG_NFC_DRIVER_NXP=y
CONFIG_PN5190_DRV=y
CONFIG_PM_DEVICE_RUNTIME=n

# NXP SR150 UWB reader
CONFIG_DOOR_LOCK_BLE_UWB=y
CONFIG_DOOR_LOCK_ALIRO_UWB=y
CONFIG_DOOR_LOCK_ALIRO_UWB_IMPL_SR150=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
