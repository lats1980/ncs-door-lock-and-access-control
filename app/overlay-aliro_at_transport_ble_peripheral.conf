# AT transport: BLE Peripheral (NUS server), for Matter + Aliro AT Host.
# Pairs with a central exposing Nordic UART Service (same as bt_nus / central_uart).
CONFIG_ALIRO_AT_TRANSPORT_SERIAL=n
CONFIG_ALIRO_AT_TRANSPORT_BLE=y

# Exclude Lock NUS commands from the default NUS command pool, since the peripheral doesn't need them and it saves RAM.
CONFIG_DOOR_LOCK_BT_NUS_MAX_COMMANDS=1
# Increase max command length to allow for longer AT commands (e.g. with more parameters) - adjust as needed.
CONFIG_DOOR_LOCK_BT_NUS_MAX_COMMAND_LEN=200
# Don't need authentication or passkey entry for the peripheral role in this demo, so disable to save code/RAM.
CONFIG_BT_NUS_AUTHEN=n
CONFIG_BT_APP_PASSKEY=n