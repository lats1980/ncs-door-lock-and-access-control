CONFIG_ALIRO_AT_HOST=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_CHIP_FACTORY_RESET_ERASE_SETTINGS=n
CONFIG_NFC_DRIVER_STM=n
CONFIG_NFC_DRIVER_NXP=n
CONFIG_NCS_ALIRO=n

# Aliro storage and expedited phase run on the external MCU.
CONFIG_DOOR_LOCK_EXPEDITED_FAST_PHASE=n
CONFIG_DOOR_LOCK_EXTERNAL_NVS=n

# Inherited from prj.conf; NFC drivers are disabled for AT Host.
CONFIG_DOOR_LOCK_RFAL_LOG_LEVEL_OFF=y
CONFIG_DOOR_LOCK_NXPNFCRDLIB_LOG_LEVEL_OFF=y
CONFIG_SHELL_ASYNC_API=y
