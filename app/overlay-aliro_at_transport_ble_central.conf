# AT transport: BLE Central (NUS client), for Matter + Aliro AT Host.
# Pairs with a peripheral exposing Nordic UART Service (same as bt_nus / peripheral_uart).
CONFIG_ALIRO_AT_TRANSPORT_SERIAL=n
CONFIG_ALIRO_AT_TRANSPORT_BLE=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_ID_MAX=2

# NUS client + GATT discovery + scan (see samples/bluetooth/central_uart)
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_SCAN_ADDRESS_CNT=1

# Matter commissioning BLE + AT NUS central link
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# Bonding / reconnection to known NUS peer (with CONFIG_BT_SETTINGS from Matter)
CONFIG_BT_SETTINGS=y

# Extra heap for NUS client / scan / GATT DM (raise if Matter default is lower)
CONFIG_HEAP_MEM_POOL_SIZE=8192
