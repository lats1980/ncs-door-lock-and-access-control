manifest:
  self:
    west-commands: scripts/west-commands.yml
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: ncs-ssh
      url-base: git@github.com:nrfconnect
    - name: nrfconnect-uwb-qorvo
      url-base: git@gitlab.com:qorvo/qswg/public
    - name: ncs-customization
      url-base: https://github.com/lats1980
  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.2.0
      import: true
    - name: nrfconnect-sdk-qorvo
      remote: nrfconnect-uwb-qorvo
      repo-path: nrfconnect-uwb-sdk
      revision: QM35ALIRO_ENG-0.6.1
      groups:
        - nrfconnect-sdk-qorvo
    - name: matter
      remote: ncs-customization
      repo-path: sdk-connectedhomeip
      path: modules/lib/matter
      # v3.2-door-lock-app-split
      revision: 8905bee9ab388d7ce21765c446e6e8a722476513
      west-commands: scripts/west/west-commands.yml
      submodules:
        - name: nlio
          path: third_party/nlio/repo
        - name: nlassert
          path: third_party/nlassert/repo
        - name: pigweed
          path: third_party/pigweed/repo
        - name: jsoncpp
          path: third_party/jsoncpp/repo
      userdata:
        ncs:
          upstream-url: https://github.com/project-chip/connectedhomeip
          upstream-sha: 181b0cb14ff007ec912f2ba6627e05dfb066c008
          compare-by-default: false
    - name: ncs-door-lock-app-extensions
      remote: ncs-ssh
      repo-path: ncs-door-lock-app-extensions
      revision: v1.0.0
      groups:
        - ncs-door-lock-app-extensions
  group-filter:
    - -nrfconnect-sdk-qorvo
    - -ncs-door-lock-app-extensions
